[workspace]
members = [
    "packages/accesskit_xplat",
    "packages/bliss-traits",
    "packages/bliss-dom",
    "packages/bliss-html",
    "packages/bliss-net",
    "packages/bliss-paint",
    "packages/bliss-shell",
    "packages/bliss",
    "packages/stylo_taffy",
    "packages/anyrender_vello",
]
exclude = ["sites"]
resolver = "2"

[workspace.package]
version = "0.3.1"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nixpt/bliss-engine"
repository = "https://github.com/nixpt/bliss-engine"
categories = ["gui"]
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
# BLISS-HOME-1 (s506): content-synced from nixpt/arniko @ 8bc8541
# (branch agent/vega/ARNIKO-license-fixes) — the current, actively-developed
# source of truth for these crates. The dependency versions below are
# arniko's pins, NOT bliss-engine's pre-sync pins (which had drifted to much
# newer majors — stylo 0.17, taffy experimental-cache-fix, parley 0.9,
# anyrender 0.10, wgpu 29 — against code that was never updated to match).
# Bringing the code in without also bringing its actual dependency graph
# would not compile.
bliss = { path = "./packages/bliss", version = "0.3.0", package = "arniko-bliss" }
bliss-dom = { path = "./packages/bliss-dom", version = "0.3.0", default-features = false }
bliss-html = { path = "./packages/bliss-html", version = "0.3.0", default-features = false }
bliss-net = { path = "./packages/bliss-net", version = "0.3.0", default-features = false }
bliss-paint = { path = "./packages/bliss-paint", version = "0.3.0", default-features = false }
bliss-shell = { path = "./packages/bliss-shell", version = "0.3.0", default-features = false }
bliss-traits = { path = "./packages/bliss-traits", version = "0.3.0", default-features = false }
stylo_taffy = { path = "./packages/stylo_taffy", version = "0.3.0", package = "bliss-stylo-taffy", default-features = false }
# debug_timer: our copy is a cosmetic-only fork of nicoburns' published
# debug_timer 0.1.3 (one import-order diff, confirmed by diffing against the
# fetched crates.io tarball) — depend on the upstream crate directly rather
# than republishing an identical copy under a new name.
debug_timer = { version = "0.1.3" }
# accesskit_xplat: our copy is a GENUINE fork (graceful UiKit/WinRT fallback
# instead of unimplemented!(), hardened Android JNI thread attach — confirmed
# by diffing against the fetched crates.io tarball). Needs its own bliss-*
# name to publish; `bliss-accesskit-xplat` is free on crates.io as of this
# commit. `package =` keeps the in-repo `accesskit_xplat` import path working.
accesskit_xplat = { path = "./packages/accesskit_xplat", version = "0.3.0", package = "bliss-accesskit-xplat", default-features = false }
# anyrender_vello: our copy is a GENUINE fork (SceneOverlay/set_scene_effects
# mustang hooks, most of the divergence in window_renderer.rs — confirmed by
# diffing against the fetched crates.io tarball for 0.7.1). Needs its own
# bliss-* name; `bliss-anyrender-vello` is free on crates.io as of this
# commit. `package =` keeps the in-repo `anyrender_vello` import path working.
anyrender_vello = { path = "./packages/anyrender_vello", version = "0.3.0", package = "bliss-anyrender-vello" }

# Servo / Stylo
style = { version = "0.11.0", package = "stylo" }
style_traits = { version = "0.11.0", package = "stylo_traits" }
style_atoms = { version = "0.11.0", package = "stylo_atoms" }
style_config = { version = "0.11.0", package = "stylo_config" }
style_dom = { version = "0.11.0", package = "stylo_dom" }
selectors = { version = "0.35.0" }
cssparser = { version = "0.36" }
markup5ever = "0.37.0"
html5ever = "0.37.0"
xml5ever = "0.37.0"
euclid = "0.22"
atomic_refcell = "0.1.13"
app_units = "0.7.5"
smallvec = "1"

# DioxusLabs Taffy
taffy = { version = "0.11", default-features = false, features = [
    "std", "flexbox", "grid", "block_layout", "content_size", "calc", "detailed_layout_info",
] }

# Linebender Parley
parley = { version = "0.10", default-features = false, features = ["std"] }

# GPU / rendering
anyrender = "0.7"
anyrender_svg = "0.8"
wgpu = "27"
vello = { version = "0.7", features = ["wgpu"] }
wgpu_context = "0.3"
peniko = "0.6.0"
kurbo = "0.13"
skrifa = { version = "0.40", default-features = false, features = ["std"] }
color = "0.3.2"
linebender_resource_handle = "0.1"
usvg = "0.46"
pollster = "0.4"
rustc-hash = "2"

# Windowing & input
winit = { version = "=0.31.0-beta.2" }
raw-window-handle = { version = "0.6.2", features = ["std"] }
accesskit = "0.24"
keyboard-types = "0.7"
cursor-icon = "1"
arboard = { version = "3.4.1", default-features = false }
rfd = { version = "0.17.1", default-features = false }

# Networking
tokio = { version = "1.42", features = ["rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false }
reqwest-middleware = { version = "0.4", default-features = false }
http-cache-reqwest = { version = "0.15", default-features = false }
url = "2.5.0"
http = "1.1.0"
data-url = "0.3.1"
bytes = "1.7.1"
directories = "6.0.0"

# Misc
serde = "1"
serde_json = "1"
anyhow = "1.0"
tracing = "0.1.40"
futures-util = "0.3.30"
bitflags = "2.8.0"
slab = "0.4.9"
image = { version = "0.25", default-features = false }
smol_str = "0.3"
rayon = "1"
thread_local = "1"

[profile.profile]
inherits = "release"
debug = true

[profile.production]
inherits = "release"
opt-level = 3
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

[profile.p2]
inherits = "production"
opt-level = 2

[profile.small]
inherits = "production"
opt-level = "s"
panic = "abort"

[profile.small-panic]
inherits = "small"
panic = "unwind"

[profile.tiny]
inherits = "small"
opt-level = "z"

[profile.tiny.package.taffy]
opt-level = 3
[profile.tiny.package.skrifa]
opt-level = 3

name: CI

# BLISS-HOME-1 (s506): replaced the old CI (last green 2026-05-18) — it
# referenced example crates that no longer exist anywhere in this repo
# (`readme`, `counter`, `seven_guis`, `todomvc`, `wasm_hello` — none of
# these are workspace members, none have a Cargo.toml under examples/),
# and its MSRV/cross-platform (iOS/Android via `cross`) jobs predate the
# content sync entirely. This is a lean, correct baseline over the crates
# that actually exist in `packages/` today: check + test + clippy on
# ubuntu/stable. Restoring the full cross-platform matrix (Windows/macOS/
# iOS/Android/wasm) against real, working example crates is real follow-up
# work, out of scope for the publish-readiness goal this PR serves.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check + test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install apt deps (GTK/xdo — winit/rfd/arboard need them)
        # Plain apt-get, not awalsh128/cache-apt-pkgs-action: its restored cache left
        # fontconfig's pkg-config file missing, so yeslogic-fontconfig-sys's build
        # script failed and every job was red from 2026-10-12.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libxdo-dev libasound2-dev libudev-dev libssl-dev libfontconfig1-dev

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

  msrv:
    # rust-version = 1.89 (workspace.package): smol_str 0.3.4+ (bliss-traits) needs
    # 1.89, fontique 0.10 needs 1.88. Checked on exactly that toolchain so the
    # declared MSRV stays true (0.3.0 claimed 1.85, which never built).
    name: msrv (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Install apt deps
        # Plain apt-get, not awalsh128/cache-apt-pkgs-action: its restored cache left
        # fontconfig's pkg-config file missing, so yeslogic-fontconfig-sys's build
        # script failed and every job was red from 2026-10-12.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libxdo-dev libasound2-dev libudev-dev libssl-dev libfontconfig1-dev
      - name: cargo check (MSRV)
        run: cargo check --workspace --all-targets

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install apt deps
        # Plain apt-get, not awalsh128/cache-apt-pkgs-action: its restored cache left
        # fontconfig's pkg-config file missing, so yeslogic-fontconfig-sys's build
        # script failed and every job was red from 2026-10-12.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libxdo-dev libasound2-dev libudev-dev libssl-dev libfontconfig1-dev
      - run: cargo doc --workspace --no-deps
      - name: cargo doc as docs.rs builds it (per crate, docs.rs features)
        # docs.rs builds each crate alone with its [package.metadata.docs.rs]
        # features (all-features for most of ours). A feature that can't compile
        # (bliss-shell's `exoshell`, whose dependency is not on crates.io) only
        # shows up this way.
        run: |
          set -o pipefail
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | [.name, ((.metadata.docs.rs."all-features") // false), (((.metadata.docs.rs.features) // []) | join(","))] | @tsv' \
            | while IFS=$'\t' read -r name all features; do
                args=(-p "$name" --no-deps)
                if [ "$all" = true ]; then args+=(--all-features); elif [ -n "$features" ]; then args+=(--features "$features"); fi
                echo "::group::cargo doc ${args[*]}"
                cargo doc "${args[@]}"
                echo "::endgroup::"
              done

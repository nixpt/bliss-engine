[package]
name = "bliss-net"
version.workspace = true
description = "Bliss networking"
documentation = "https://docs.rs/bliss-net"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true

[features]
default = []
http2 = ["reqwest/http2"]
cookies = ["reqwest/cookies"]
multipart = ["reqwest/multipart", "reqwest/stream"]
cache = ["dep:reqwest-middleware", "dep:http-cache-reqwest", "dep:directories"]
debug_log = []

[dependencies]
bliss-traits = { path = "../bliss-traits", version = "0.3.0" }
tokio = { version = "1.42", features = ["rt", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["charset", "rustls-tls"] }
data-url = "0.3.1"

# Caching (optional)
reqwest-middleware = { version = "0.4.2", default-features = false, optional = true }
http-cache-reqwest = { version = "=1.0.0-alpha.2", default-features = false, features = ["manager-cacache"], optional = true }
directories = { version = "6.0.0", optional = true }

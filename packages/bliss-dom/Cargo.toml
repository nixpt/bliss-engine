[package]
name = "bliss-dom"
version.workspace = true
description = "Bliss DOM implementation"
documentation = "https://docs.rs/bliss-dom"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true

[features]
default = [
    "svg",
    "woff-rust",
    "system_fonts",
]
tracing = ["dep:tracing"]
svg = ["dep:usvg"]
# WOFF decoding using the "wuff" crate which is pure Rust
woff-rust = ["dep:wuff"]
accessibility = ["dep:accesskit"]
system_fonts = ["parley/system"]
autofocus = []
floats = ["taffy/float_layout", "stylo_taffy/floats"]
file_input = []
incremental = []
parallel-construct = []
log_phase_times = ["debug_timer/enable"]

[dependencies]
# Bliss dependencies
bliss-traits = { path = "../bliss-traits", version = "0.3.0" }
stylo_taffy = { path = "../stylo_taffy", version = "0.3.0", package = "bliss-stylo-taffy", features = ["default"] }
debug_timer = { workspace = true }

# Real dyn-Document downcasting. Document: Any alone is NOT enough: a
# downcast_rs::Downcast blanket impl only covers Sized types, so a bare
# `Box<dyn Document>` gets the blanket impl on the OUTER Box (Box is itself
# Sized + Any + 'static) instead of on the inner trait object — callers
# calling `.as_any_mut()` on the box always get an Any wrapping the Box
# itself, never the concrete document behind it, so downcast_mut::<T>()
# always fails. Document must carry Downcast as a real supertrait (giving
# dyn Document its own vtable entry for it) for downcasting to work at all.
downcast-rs = "2.0.2"

# Servo dependencies
style = { version = "0.11.0", package = "stylo" }
selectors = "0.35.0"
cssparser = "0.36"
style_config = { version = "0.11.0", package = "stylo_config" }
style_traits = { version = "0.11.0", package = "stylo_traits" }
style_dom = { version = "0.11.0", package = "stylo_dom" }
app_units = "0.7.5"
euclid = "0.22"
atomic_refcell = "0.1.13"
markup5ever = "0.37.0"
smallvec = "1"

# DioxusLabs dependencies
taffy = { workspace = true }

# Linebender/Fontations dependencies
accesskit = { version = "0.24", optional = true }
parley = { workspace = true }
parlance = "0.1"
skrifa = { version = "0.40", default-features = false, features = ["std"] }
linebender_resource_handle = "0.1"
color = "0.3.2"

# Other dependencies
slab = "0.4.9"
bitflags = "2.8.0"
tracing = { version = "0.1.40", optional = true }
fastrand = "2.3.0"
rayon = "1"

# Media & Decoding
image = { version = "0.25", default-features = false }
usvg = { version = "0.46", optional = true }
wuff = { version = "0.2", optional = true }
html-escape = "0.2.13"
percent-encoding = "2.3.1"

# IO & Networking
url = "2.5.0"

# Input
keyboard-types = "0.7"
cursor-icon = "1"
thread_local = "1"

# HACK: Bliss doesn't need to depend on objc2 directly. But this feature flag is necessary
# to prevent debug builds from panicking.
[target.'cfg(any(target_vendor = "apple"))'.dependencies]
objc2 = { version = "0.6", features = ["disable-encoding-assertions"] }

[package]
name = "bliss-paint"
version.workspace = true
description = "Paint a Bliss Document using anyrender"
documentation = "https://docs.rs/bliss-paint"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true

[features]
default = ["svg"]
tracing = ["dep:tracing"]
svg = ["dep:anyrender_svg", "dep:usvg", "bliss-dom/svg"]

[dependencies]
# Bliss dependencies
anyrender = "0.7"
anyrender_svg = { version = "0.8", optional = true }
bliss-traits = { path = "../bliss-traits", version = "0.3.0" }
bliss-dom = { path = "../bliss-dom", version = "0.3.0" }

# Servo dependencies
style = { version = "0.11.0", package = "stylo" }
euclid = "0.22"

# DioxusLabs dependencies
taffy = { workspace = true }

# Linebender + WGPU dependencies
parley = { workspace = true }
color = "0.3.2"
peniko = "0.6.0"
kurbo = "0.13"
usvg = { version = "0.46", optional = true }

# Other dependencies
tracing = { version = "0.1.40", optional = true }

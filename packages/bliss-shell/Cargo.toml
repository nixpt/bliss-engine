[package]
name = "bliss-shell"
version.workspace = true
description = "Bliss application shell"
documentation = "https://docs.rs/bliss-shell"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true

[features]
default = ["clipboard", "file_dialog"]
clipboard = ["dep:arboard"]
tracing = ["dep:tracing", "bliss-dom/tracing"]
file_dialog = ["dep:rfd"]
accessibility = ["dep:accesskit", "dep:accesskit_xplat", "bliss-dom/accessibility"]
# Enables a data-uri-only NetProvider. Only needed if you aren't using the regular NetProvider
data-uri = ["dep:data-url"]
# ExoShell integration — monorepo-only; dep removed for crates.io publish (exo-shell-client not on registry)
exoshell = []

[dependencies]
# Bliss dependencies
bliss-traits = { path = "../bliss-traits", version = "0.3.0" }
bliss-dom = { path = "../bliss-dom", version = "0.3.0" }
bliss-paint = { path = "../bliss-paint", version = "0.3.0" }
anyrender = "0.7"
anyrender_vello = { workspace = true }

# Windowing & Input
winit = "=0.31.0-beta.2"
keyboard-types = "0.7"
accesskit = { version = "0.24", optional = true }
accesskit_xplat = { workspace = true, optional = true }

# Other dependencies
tracing = { version = "0.1.40", optional = true }
futures-util = "0.3.30"
data-url = { version = "0.3.1", optional = true }

# exo-shell-client removed for crates.io publish (not on registry; monorepo-only path dep)
tokio = { version = "1.0", features = ["net", "io-util", "rt"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = "0.6.0"

[target.'cfg(any(target_os = "windows",target_os = "macos",target_os = "linux",target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
arboard = { version = "3.4.1", default-features = false, optional = true }

[target.'cfg(any(target_os = "windows",target_os = "macos",target_os = "linux",target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
rfd = { version = "0.17.1", default-features = false, features = ["xdg-portal"], optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
